
openapi: 3.0.0

info:
  title: Games API
  version: 1.0.0
  description: |
    This is a Swagger UI for our Games API.

servers:
  - url: http://localhost:8080
    description: Local server

paths:
  /games/{id}:
    get:
      summary: Get game by ID
      operationId: getGameById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Response for status 200
        '404':
          description: Response for status 404

components:
  schemas:
    error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
