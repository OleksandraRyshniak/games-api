
openapi: 3.0.0

info:
  title: Games API
  version: 1.0.0
  description: |
    Games API with role-based access.

    Guest: View games.
    User: View and create games.
    Admin: View, create, update and delete games.

    Click Authorize to sign in.

servers:
  - url: http://localhost:8080
    description: Local server

paths:
  /games:
    get:
      tags:
        - Games
      summary: Get all games
      description: Returns all games (public)
      operationId: getGames

      responses:
        '200':
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/game'

    post:
      tags:
        - Games
      summary: Creates a game
      description: Creates a new game (user, admin)
      operationId: createGame
      security:
        - basicAuth: []
      requestBody:
        required: true
        description: A new game to be created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/new-game'
            example:
              name: Tetris
              price: 0.99
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the created game
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/game'
              example:
                id: 9
                name: Tetris
                price: 0.99
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /games/{id}:
    get:
      tags:
        - Games
      summary: Get game by ID
      description: Returns one game (public)

      operationId: getGameById

      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '200':
          description: Game found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/game'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Games
      summary: Updates a game
      description: Updates an existing game (admin only)
      operationId: updateGame
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/new-game'
            example:
              name: Tetris
              price: 1.99
      responses:
        '200':
          description: Game updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/game'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

    delete:
      tags:
        - Games
      summary: Deletes a game
      description: Deletes a game by ID (admin only)
      operationId: deleteGame
      security:
        - basicAuth: []
      parameters:
        - $ref: '#/components/parameters/GameId'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'



components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Enter your username and password

  parameters:
    GameId:
      name: id
      in: path
      required: true
      description: ID of the game
      schema:
        type: integer
        example: 1

  schemas:
    game:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Witcher 3
        price:
          type: number
          format: float
          example: 29.99а

    new-game:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          example: Tetris
        price:
          type: number
          format: float
          minimum: 0
          example: 0.99

    error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          example: Game not found

  responses:
    BadRequest:
      description: Invalid or missing name or price
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error: Invalid or missing name or price

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error: Authentication required

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error: Forbidden

    NotFound:
      description: Game not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error: Game not found

    Conflict:
      description: Game with this name already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error'
          example:
            error: Game with this name already exists
