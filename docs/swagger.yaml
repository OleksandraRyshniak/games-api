openapi: 3.0.0

info:
  title: Games API
  version: 1.0.0
  description: |
    This is a Swagger UI for our Games API.

servers:
  - url: http://localhost:8080
    description: Local server

paths:
  /games:
    get:
      tags:
        - Games
      summary: Get all games
      description: Returns the list of all games
      operationId: getGames

      responses:
        '200':
          description: List of games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/game'

    post:
      tags:
        - Games
      summary: Creates a game
      description: Creates a new game
      operationId: createGame

      requestBody:
        description: A new game to be created
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/new-game'
            example:
              name: Tetris
              price: 0.99

      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URL of the created game
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/game'
              example:
                id: 9
                name: Tetris
                price: 0.99

        '400':
          description: One or all params are missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error: One or all params are missing
        '409':
          description: Game with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error: Game with this name already exists

  /games/{id}:
    get:
      tags:
        - Games
      summary: Get game by ID
      operationId: getGameById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer

      responses:
        '200':
          description: Game found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/game'

        '404':
          description: Game not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error: Game not found

    put:
      tags:
        - Games
      summary: Updates a game
      description: Updates name and price of an existing game
      operationId: updateGame
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the game to update
          schema:
            type: integer
            example: 1

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/new-game'
            example:
              name: Tetris
              price: 1.99

      responses:
        '200':
          description: Game updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/game'

        '400':
          description: One or all params are missing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error: One or all params are missing

        '404':
          description: Game not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error: Game not found



    delete:
      tags:
        - Games
      summary: Deletes a game
      description: Deletes an existing game by ID
      operationId: deleteGame

      parameters:
        - name: id
          in: path
          required: true
          description: ID of the game to delete
          schema:
            type: integer
            example: 1

      responses:
        '204':
          description: No Content

        '404':
          description: Game not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
              example:
                error: Game not found

components:
  schemas:
    game:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Witcher 3
        price:
          type: number
          format: float
          example: 29.99

    new-game:
      type: object
      properties:
        name:
          type: string
          example: Tetris
        price:
          type: number
          format: float
          example: 0.99
      required:
        - name
        - price

    error:
      type: object
      properties:
        error:
          type: string
          example: One or all params are missing
      required:
        - error